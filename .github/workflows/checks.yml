name: Repository checks

on:
  pull_request:
  push:
    branches: [main, 'huy/**', 'nguyen/**', 'truc/**']

permissions:
  contents: read

jobs:
  guardrails:
    name: Guardrails and acceptance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/dev.txt
      - run: python scripts/guardrails.py --all --tests
