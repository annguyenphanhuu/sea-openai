name: Repository checks

on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'docs/**', 'refactor/**', 'test/**', 'perf/**', 'build/**', 'ci/**', 'revert/**']

permissions:
  contents: read

jobs:
  guardrails:
    name: Guardrails and acceptance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/dev.txt
      - name: Validate PR branch name
        if: github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: python scripts/check_branch.py "$PR_BRANCH"
      - run: python scripts/guardrails.py --all --tests
