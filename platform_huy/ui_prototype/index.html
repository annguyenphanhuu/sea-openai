<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chợ Phố · Phòng điều hành — UI prototype</title>
<style>
:root{font-family:Inter,"Segoe UI",sans-serif;color:#24372f;background:#f5f6f2;font-synthesis:none;--green:#236148;--line:#dfe5dc;--muted:#758276}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #b58630;outline-offset:3px}button{border:1px solid var(--line);border-radius:7px;background:white;padding:10px 14px;color:inherit}button:hover{border-color:#71927c}.primary{background:var(--green);color:#fff;border-color:var(--green)}.shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh}.sidebar{background:#183d30;color:#d7e6db;padding:30px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{font-size:25px;color:#fff;letter-spacing:-1px;font-weight:700}.brand small{display:block;font-size:10px;letter-spacing:3px;font-weight:400;margin-top:7px}.side-label{font-size:10px;letter-spacing:1.6px;margin:44px 12px 12px;color:#91b29f}.nav-item{padding:13px 14px;border-radius:6px;font-size:13px;margin-bottom:7px}.nav-item.active{background:#2e5545;color:white}.sidebar footer{margin-top:auto;font-size:12px;line-height:1.9;color:#a7c1b1}.avatar{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#dce7da;color:#365b43;font-size:12px;font-weight:600}.main{padding:0 38px 110px;max-width:1700px;width:100%;margin:auto}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}.row{display:flex;align-items:center;gap:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4b9567;margin-right:7px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.8px;color:var(--muted);font-weight:600}.page-heading{display:flex;justify-content:space-between;align-items:center;margin:34px 0 26px;gap:18px}h1{font-size:31px;letter-spacing:-1.1px;font-weight:600;margin:9px 0}h2{font-size:17px;font-weight:600;margin:0 0 7px}h3{font-size:14px;margin:0 0 10px}p{font-size:13px;line-height:1.65;margin:5px 0;color:var(--muted)}.notice{display:flex;justify-content:space-between;gap:14px;background:#eef1e6;border:1px solid #dce3cb;padding:14px 18px;border-radius:8px;font-size:12px;line-height:1.65;margin-bottom:22px}.notice.warn{background:#fff4e5;border-color:#efdbb7}.badge{font-size:10px;padding:5px 8px;border-radius:4px;white-space:nowrap;font-weight:600;background:#e9efe6;color:#426b46}.badge.amber{background:#fbedd4;color:#916319}.badge.red{background:#f8e6e1;color:#a24c3a}.badge.blue{background:#e6edf2;color:#517189}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.stat{background:white;border:1px solid var(--line);padding:19px 22px;border-radius:9px}.stat strong{display:block;font-size:30px;font-weight:500;letter-spacing:-1px;margin:13px 0 6px}.stat small{font-size:11px;color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:9px;overflow:hidden}.panel-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.dashboard{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:20px}.toolbar{padding:14px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.filter{padding:7px 11px;font-size:11px;border-color:transparent;background:#f4f6f1}.filter.selected{background:#e2ece0;color:#29603f;border-color:#c8d8c4}input{min-width:0;border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:6px;font-size:12px}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;background:#f8f9f5;color:var(--muted);font-size:10px;font-weight:500;padding:12px 18px}td{padding:19px 18px;border-bottom:1px solid #edf0e9}tr.pick{background:#f1f6ed}tbody tr{cursor:pointer}tbody tr:hover{background:#f5f8f1}td small{display:block;color:var(--muted);margin-top:5px;font-size:10px}.order-code{font-weight:600;white-space:nowrap}.detail{padding:22px}.detail .row{justify-content:space-between;margin-bottom:17px}.route{background:#f6f7f2;padding:13px;border-radius:6px;margin:18px 0;font-size:12px;line-height:1.9}.evidence{border-left:1px solid #d0ddca;margin:22px 0 22px 5px;padding-left:18px}.evidence div{position:relative;margin-bottom:20px}.evidence div:before{content:'';position:absolute;left:-23px;top:4px;width:8px;height:8px;border-radius:50%;background:#7c9e76;border:2px solid white}.evidence b{font-size:12px;font-weight:500}.evidence p{font-size:11px}.full{width:100%;margin-top:8px}.section-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin:23px 0 12px}.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.agent{padding:18px;background:#fff;border:1px solid var(--line);border-radius:8px}.agent p{font-size:11px}.agent .row{justify-content:space-between;margin-bottom:10px}.switcher{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#20372e;color:white;box-shadow:0 6px 28px #172e3025;border-radius:12px;padding:8px;display:flex;align-items:center;gap:8px;z-index:10}.switcher button{background:#ffffff12;border:0;color:white;padding:9px 14px}.switcher .label{font-size:12px;min-width:210px;text-align:center}.switcher small{font-size:9px;color:#b5c6ba;display:block;margin-bottom:4px;letter-spacing:1px}.state{margin-top:22px;border-top:1px solid var(--line);padding-top:13px;font-size:11px;color:var(--muted)}.state summary{cursor:pointer}.state pre{white-space:pre-wrap;font-size:11px;line-height:1.6}.queue{display:grid;grid-template-columns:275px minmax(0,1fr);gap:24px}.queue-list{display:flex;flex-direction:column;gap:10px}.queue-card{text-align:left;padding:18px;background:#fff;border:1px solid var(--line);border-radius:8px}.queue-card.pick{border-color:#49845f;box-shadow:inset 3px 0 #49845f}.queue-card p{font-size:11px}.workbench{display:grid;grid-template-columns:1fr 1fr;gap:24px}.conversation{background:#f6f7f3;min-height:230px;padding:20px;border-radius:8px;margin-top:15px;display:flex;flex-direction:column;gap:14px}.bubble{background:white;border:1px solid var(--line);font-size:12px;line-height:1.7;padding:13px;border-radius:9px;max-width:95%}.bubble.reply{background:#e7eee2;align-self:flex-end}.timeline-layout{display:grid;grid-template-columns:1fr 330px;gap:35px}.timeline{position:relative;padding-left:45px;border-left:1px solid #bacaac;margin-left:18px}.timeline article{position:relative;padding:0 0 30px}.timeline article:before{content:attr(data-agent);position:absolute;left:-64px;top:0;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;background:#e4ecdd;border:5px solid #f5f6f2;font-size:10px;font-weight:700}.timeline article>div{padding:22px;background:white;border:1px solid var(--line);border-radius:8px}.action-feedback{padding:12px;background:#e8f0e1;border-radius:6px;font-size:12px;line-height:1.6;margin-top:12px}.empty{padding:30px;color:var(--muted)}.mobile-label{display:none}@media(min-width:1500px){.main{padding-left:52px;padding-right:52px}}@media(max-width:1150px){.shell{grid-template-columns:180px 1fr}.main{padding:0 24px 110px}.dashboard{grid-template-columns:1fr}.detail{display:grid;grid-template-columns:1fr 1fr;gap:25px}.detail .detail-actions{grid-column:1/-1}.timeline-layout{grid-template-columns:1fr 280px}.workbench{grid-template-columns:1fr}.stats{gap:10px}.stat{padding:16px}}@media(max-width:760px){.shell{display:block}.sidebar{height:auto;position:static;padding:18px 22px}.sidebar .side-label,.sidebar .nav-item,.sidebar footer{display:none}.brand{font-size:22px}.brand small{display:inline;margin-left:15px;font-size:8px}.main{padding:0 18px 110px}.topbar{height:60px}.page-heading{align-items:flex-start;flex-direction:column;margin:24px 0}h1{font-size:27px}.stats{grid-template-columns:1fr 1fr}.agents,.queue,.timeline-layout,.detail{grid-template-columns:1fr}.queue-list{display:grid;grid-template-columns:1fr 1fr}.workbench{display:block}.notice{flex-direction:column}.table-wrap{overflow:auto}.switcher{bottom:12px;max-width:95vw}.switcher .label{min-width:180px}.topbar .row:last-child{display:none}.toolbar input{width:100%}.timeline{padding-left:30px}.timeline article:before{left:-49px}.panel-head{padding:17px}.stat strong{font-size:26px}}
</style>
</head>
<body><div id="app"></div><div id="switcher" class="switcher" aria-label="Chọn phương án giao diện"></div>
<script>
// THROWAWAY: three operational UI concepts on one route, selected by ?variant=A|B|C.
// All records below are UI illustrations, never source data, assessments, or executable actions.
const orders=[
 {id:'DEMO-0281',name:'Nguyễn Minh Anh',route:'Bình Tân → Đà Nẵng',status:'Nguy cơ trễ',tone:'amber',eta:'30/10',due:'29/10',prob:82,fault:'Chưa kết luận',reason:'Chuyến trục chưa ghi nhận đến trung tâm đích.',last:'10:45 · Đã xuất bến',confidence:78},
 {id:'DEMO-0194',name:'Trần Hoàng Nam',route:'Thủ Đức → Bình Thạnh',status:'Đang trễ',tone:'red',eta:'29/10',due:'27/10',prob:100,fault:'Chưa kết luận',reason:'Đã hết ngày đảm bảo; chưa có bằng chứng giao thành công.',last:'09:10 · Đến bưu cục',confidence:91},
 {id:'DEMO-0342',name:'Lê Thu Hà',route:'Hà Nội → Hải Phòng',status:'Thiếu dữ liệu',tone:'blue',eta:null,due:'29/10',prob:null,fault:'Chưa kết luận',reason:'Nguồn dữ liệu hãng vận chuyển chưa cập nhật đủ.',last:'08:30 · Bàn giao hãng',confidence:35},
 {id:'DEMO-0408',name:'Phạm Quốc Huy',route:'Bình Tân → Quận 7',status:'Đúng tiến độ',tone:'',eta:'28/10',due:'28/10',prob:8,fault:'Chưa kết luận',reason:'Kiện đang được giao trong ngày đảm bảo.',last:'11:20 · Đang giao hàng',confidence:94}
];
const names={A:'Bảng điều hành',B:'Hàng đợi xử lý',C:'Dòng thời gian'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';
const state={selected:orders[0].id,filter:'Tất cả',search:'',guardHealthy:false,a3:null,pending:false,apiError:'',prepared:[],handoffs:[],feedback:''};
const badge=o=>`<span class="badge ${o.tone}">${o.status}</span>`;
const current=()=>orders.find(o=>o.id===state.selected);
const canContact=o=>!state.pending&&state.guardHealthy&&o.status!=='Thiếu dữ liệu'&&o.prob>=70;
function heading(title,subtitle){return `<div class="page-heading"><div><div class="eyebrow">Phòng điều hành / ${names[variant]}</div><h1>${title}</h1><p>${subtitle}</p></div><button id="next-tick" onclick="tick()" ${state.pending?'disabled':''}>NEXT · +30 phút</button></div>`}
function guard(){const a=state.a3;const healthy=a&&a.guard_alive;const feeds=a?a.feed_health.map(f=>`${escapeHtml(f.feed)}: ${escapeHtml(f.status)} · ${f.age_minutes===null?'không có mốc nguồn':f.age_minutes.toFixed(1)+' phút'}<br><small>Mốc nguồn: ${escapeHtml(f.source_timestamp||'—')}</small>`).join('<br>'):'';return `<div class="notice ${state.guardHealthy?'':'warn'}" aria-live="polite"><div><b>A3 thực · guard_alive: <span id="guard-alive">${healthy?'true':'false'}</span> · proactive_allowed: <span id="proactive-allowed">${state.guardHealthy?'true':'false'}</span></b><br>Giờ mô phỏng: <b id="simulation-now">${escapeHtml(a?a.now:'chưa kết nối')}</b><br>Heartbeat cuối: ${escapeHtml(a?a.last_heartbeat_at||'chưa chạy NEXT':'—')}<br>${feeds}<br>${state.apiError?escapeHtml(state.apiError):a&&a.killed?'A3 đã dừng. NEXT vẫn tiến giờ; không tạo heartbeat.':a&&a.resume_pending?'Đã yêu cầu khởi động. Cần NEXT để A3 tạo heartbeat thực.':'Chỉ NEXT chạy A3. Kiểm tra API trước mỗi bản nháp; chưa gửi tin nhắn.'}</div><div class="row"><button id="kill-a3" onclick="killGuard()" ${state.pending?'disabled':''}>Dừng A3</button><button id="revive-a3" onclick="reviveGuard()" ${state.pending?'disabled':''}>Khởi động A3</button></div></div>`}
function stats(){return `<div class="stats">${[['Đơn minh họa','04','Trong phiên thử giao diện'],['Cần chú ý','02','Một đơn trễ · một đơn có nguy cơ'],['Liên hệ đã chuẩn bị',String(state.prepared.length).padStart(2,'0'),'Chưa gửi đến khách hàng'],['Nguồn thiếu dữ liệu','01','Cần kiểm tra trước khi xử lý']].map(([a,b,c])=>`<div class="stat"><span class="eyebrow">${a}</span><strong>${b}</strong><small>${c}</small></div>`).join('')}</div>`}
function evidence(o){return `<div class="section-label">Căn cứ đánh giá · A2</div><div class="evidence"><div><b>${o.last}</b><p>Sự kiện minh họa gần nhất đã nhìn thấy</p></div><div><b>Ngày đảm bảo ${o.due}/2026</b><p>Hết ngày mới tính trễ · giờ Việt Nam</p></div><div><b>${o.reason}</b><p>Độ tin cậy minh họa ${o.confidence}% · Lỗi: ${o.fault}</p></div></div>`}
function actions(o){let blocked=!canContact(o);return `<div class="detail-actions"><div class="section-label">Bước tiếp theo</div><p>${blocked?'Chưa đủ điều kiện liên hệ chủ động. Có thể chuyển nhân viên xem xét.':'Có thể chuẩn bị chat để nhân viên xem nội dung trước.'}</p><button class="primary full" id="prepare-draft" onclick="prepare()" ${blocked||state.pending||state.prepared.includes(o.id)?'disabled':''}>${state.prepared.includes(o.id)?'✓ Đã chuẩn bị bản nháp':'Illustrative draft / A3 API check'}</button><button class="full" onclick="handoff()" ${state.handoffs.includes(o.id)?'disabled':''}>${state.handoffs.includes(o.id)?'✓ Đã thêm vào hàng đợi minh họa':'Chuyển nhân viên xem xét'}</button>${state.feedback?`<div class="action-feedback" role="status">${state.feedback}</div>`:''}</div>`}
function detail(o){return `<div class="detail"><div><div class="row"><span class="eyebrow">Đơn đang xem</span>${badge(o)}</div><h2>${o.id}</h2><p>${o.name}</p><div class="route">${o.route}<br>Dự kiến mới: <b>${o.eta?o.eta+'/2026':'Chưa đủ dữ liệu'}</b></div></div><div>${evidence(o)}</div>${actions(o)}</div>`}
function agents(){return `<div class="agents">${[['A3','Giám sát dữ liệu',state.guardHealthy?'Đã kiểm tra':'Đang chặn','Quyết định có an toàn để liên hệ.'],['A2','Phân tích logistics','4 đánh giá','Tình trạng, dự kiến và bằng chứng.'],['A1','Chăm sóc khách hàng',state.prepared.length+' bản nháp','Trao đổi theo dữ kiện được duyệt.']].map(([id,title,s,p])=>`<div class="agent"><div class="row"><span class="badge">${id}</span><span class="eyebrow">${s}</span></div><h3>${title}</h3><p>${p}</p></div>`).join('')}</div>`}
function tableRows(){const rows=orders.filter(o=>(state.filter==='Tất cả'||(state.filter==='Cần chú ý'&&o.prob>=70)||(state.filter==='Thiếu dữ liệu'&&o.eta===null))&&(o.id+' '+o.name).toLocaleLowerCase('vi').includes(state.search.toLocaleLowerCase('vi')));return rows.map(o=>`<tr class="${o.id===state.selected?'pick':''}" tabindex="0" role="button" aria-label="Xem đơn ${o.id}" onclick="selectOrder('${o.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectOrder('${o.id}')}"><td class="order-code">${o.id}<small>${o.name}</small></td><td>${badge(o)}<small>${o.last}</small></td><td>${o.due}<small>Ngày đảm bảo</small></td><td>${o.prob===null?'—':o.prob+'%'}<small>Nguy cơ trễ</small></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Không có đơn phù hợp.</td></tr>'}
function VariantA(){return heading('Mọi đơn hàng, trong tầm nhìn.','Ưu tiên đúng đơn. Hiểu bằng chứng. Liên hệ có kiểm soát.')+guard()+stats()+`<div class="dashboard"><section class="panel"><div class="panel-head"><div><h2>Theo dõi đơn hàng</h2><p>Chọn một đơn để xem đánh giá và bước tiếp theo.</p></div><span class="badge">04 ĐƠN MẪU</span></div><div class="toolbar">${['Tất cả','Cần chú ý','Thiếu dữ liệu'].map(f=>`<button class="filter ${state.filter===f?'selected':''}" onclick="setFilter('${f}')">${f}</button>`).join('')}<input aria-label="Tìm đơn hoặc tên khách" placeholder="Tìm mã đơn, tên khách…" id="search"></div><div class="table-wrap"><table><thead><tr><th>ĐƠN HÀNG</th><th>ĐÁNH GIÁ</th><th>ĐẢM BẢO</th><th>NGUY CƠ</th></tr></thead><tbody id="rows">${tableRows()}</tbody></table></div></section><aside class="panel">${detail(current())}</aside></div>`+agents()}
function VariantB(){const o=current();return heading('Xử lý từng trường hợp.','Một không gian làm việc cho bằng chứng, hội thoại và quyết định.')+guard()+`<div class="queue"><aside><div class="section-label">Hàng đợi · 4 trường hợp minh họa</div><div class="queue-list">${orders.map(x=>`<button class="queue-card ${o.id===x.id?'pick':''}" onclick="selectOrder('${x.id}')"><div class="row" style="justify-content:space-between"><b>${x.id}</b>${badge(x)}</div><p style="margin-top:12px">${x.name}</p><p>${x.route}</p></button>`).join('')}</div></aside><section class="panel"><div class="panel-head"><div><h2>${o.name}</h2><p>${o.id} &nbsp; / &nbsp; ${o.route}</p></div>${badge(o)}</div><div style="padding:24px" class="workbench"><div><h3>Hiểu trước khi trả lời</h3>${evidence(o)}<div class="route">Ngày dự kiến mới: <b>${o.eta||'Chưa xác định'}</b><br>Liên hệ chủ động: <b>${canContact(o)?'Đủ điều kiện minh họa':'Đang chặn'}</b></div>${actions(o)}</div><div><div class="eyebrow">Xem trước hội thoại · A1</div><div class="conversation"><p>Minh họa bản nháp · chưa gửi</p><div class="bubble reply">Chào bạn ${o.name}, Chợ Phố đang kiểm tra tình trạng đơn ${o.id}. ${o.eta?'Ngày dự kiến hiện tại là '+o.eta+'/2026. Đây là dự kiến, chưa phải cam kết giao mới.':'Hiện chưa đủ dữ liệu để đưa ra ngày giao dự kiến.'}</div><div class="bubble">Mình muốn gặp nhân viên hỗ trợ.</div><div class="bubble reply">Mình ghi nhận yêu cầu chuyển bạn đến nhân viên hỗ trợ.</div></div><p style="margin-top:15px">Tin nhắn khách là dữ liệu. Yêu cầu gặp người phải được chuyển tiếp; LLM không tự quyết khoản bồi thường.</p></div></div></section></div>`}
function VariantC(){const o=current();return heading('Từ tín hiệu đến hành động.','Theo dõi từng bước để biết hệ thống quyết định dựa trên điều gì.')+guard()+`<div class="toolbar" style="padding:0 0 25px">${orders.map(x=>`<button class="filter ${o.id===x.id?'selected':''}" onclick="selectOrder('${x.id}')">${x.id}</button>`).join('')}</div><div class="timeline-layout"><section class="timeline"><article data-agent="A3"><div><div class="row" style="justify-content:space-between"><h2>Kiểm tra nguồn dữ liệu</h2><span class="badge ${state.guardHealthy?'':'red'}">${state.guardHealthy?'Nguồn ổn định':'Chặn liên hệ'}</span></div><p>${state.guardHealthy?'A3 checked the release at the server simulation time. Order details below are illustrative.':'A3 API currently blocks proactive drafting; see actual feed ages above.'}</p></div></article><article data-agent="A2"><div><div class="row" style="justify-content:space-between"><h2>Đánh giá ${o.id}</h2>${badge(o)}</div>${evidence(o)}<p>Nguy cơ trễ: ${o.prob===null?'chưa xác định':o.prob+'%'} · Dự kiến: ${o.eta||'chưa đủ dữ liệu'}</p></div></article><article data-agent="A1"><div><h2>Chọn bước chăm sóc phù hợp</h2>${actions(o)}</div></article></section><aside><div class="eyebrow">Hồ sơ đơn hàng</div><h1 style="font-size:26px">${o.id}</h1><p>${o.name}</p><div class="route">${o.route}<br>Ngày đảm bảo: <b>${o.due}/2026</b><br>Ngày dự kiến: <b>${o.eta||'Chưa xác định'}</b></div><h3 style="margin-top:28px">Ba điểm cần nhớ</h3><p>01 · Dữ liệu thiếu không đồng nghĩa với hàng bị chậm.</p><p>02 · Ngày dự kiến mới không thay đổi ngày đảm bảo.</p><p>03 · Một yêu cầu hỗ trợ chưa phải một hành động đã thực thi.</p></aside></div>`}
function render(){document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">chợ phố<span style="color:#b6cc83">.</span><small>CARE OPERATIONS</small></div><div class="side-label">KHÔNG GIAN LÀM VIỆC</div><div class="nav-item active">◫ &nbsp; Phòng điều hành</div><div class="side-label">BA VAI TRÒ</div><div class="nav-item">A3 &nbsp; Giám sát dữ liệu</div><div class="nav-item">A2 &nbsp; Phân tích logistics</div><div class="nav-item">A1 &nbsp; Chăm sóc khách hàng</div><footer>SEA OPENAI HACKATHON<br>Prototype giao diện · v0.1<hr style="border:0;border-top:1px solid #3e5b4b;margin:20px 0"><span class="avatar">CP</span> &nbsp; Nhóm Chợ Phố</footer></aside><main class="main"><header class="topbar"><span><span class="dot"></span>A3 SQLITE / ILLUSTRATIVE ORDERS</span><div class="row"><span>${escapeHtml(state.a3?state.a3.now:'Connecting to A3...')}</span><span class="avatar">CP</span></div></header>${({A:VariantA,B:VariantB,C:VariantC})[variant]()}<details class="state"><summary>A3 API state / drafts remain local to this browser</summary><pre id="state-json"></pre></details><p style="font-size:10px;margin-top:15px">Order cards, customer names, delivery dates and A2/A1 metrics are UI illustrations. A3 status, simulation time and NEXT use the real read-only SQLite release and a separate local runtime. Drafts are illustrative; A1 message sending is not integrated.</p></main></div>`;document.getElementById('state-json').textContent=JSON.stringify({variant,...state,selectedOrder:current(),contactAllowed:canContact(current())},null,2);const search=document.getElementById('search');if(search){search.value=state.search;search.oninput=e=>{state.search=e.target.value;document.getElementById('rows').innerHTML=tableRows();document.getElementById('state-json').textContent=JSON.stringify({variant,...state},null,2)}}document.getElementById('switcher').innerHTML=`<button aria-label="Phương án trước" onclick="cycle(-1)">←</button><div class="label"><small>UI PROTOTYPE · ${'ABC'.indexOf(variant)+1} / 3</small>${variant} · ${names[variant]}</div><button aria-label="Phương án tiếp" onclick="cycle(1)">→</button>`}
function selectOrder(id){state.selected=id;state.feedback='';render()}
function setFilter(f){state.filter=f;render()}
async function apiCall(route,post=false){if(state.pending)return null;state.pending=true;render();try{const response=await fetch(route,{method:post?'POST':'GET',cache:'no-store',headers:post?{'Content-Type':'application/json'}:{},body:post?'{}':undefined});const result=await response.json();if(!response.ok)throw new Error(result.error||'A3 API không khả dụng');state.a3=result;state.guardHealthy=result.guard_alive===true&&result.proactive_allowed===true;state.apiError='';return result}catch(error){state.a3=null;state.guardHealthy=false;state.apiError='Mất kết nối/kiểm tra A3 thất bại. Đang chặn bản nháp.';state.feedback=state.apiError;return null}finally{state.pending=false;render()}}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function killGuard(){await apiCall('/api/a3/kill',true)}
async function reviveGuard(){await apiCall('/api/a3/revive',true)}
async function tick(){const result=await apiCall('/api/next',true);if(result){state.feedback='NEXT đã tiến đúng 30 phút và gọi A3 thực. Thẻ đơn vẫn là minh họa; chưa gửi tin nhắn.';render()}}
async function prepare(){const o=current();if(state.pending||state.prepared.includes(o.id))return;const result=await apiCall('/api/a3/proactive-check',true);if(!result||result.proactive_allowed!==true||!canContact(o)){state.feedback='API A3 đang chặn. Chưa tạo bản nháp, chưa gửi tin nhắn.';render();return}state.prepared.push(o.id);state.feedback='A3 đã cho phép bước bản nháp tại giờ mô phỏng hiện tại. Đã tạo bản nháp UI minh họa; chưa tích hợp A1 gửi tin nhắn.';render()}
function handoff(){if(state.handoffs.includes(state.selected))return;state.handoffs.push(state.selected);state.feedback='Đã ghi nhận chuyển nhân viên trong phiên UI. Chưa gửi yêu cầu đến hệ thống thật.';render()}
function cycle(dir){variant='ABC'[('ABC'.indexOf(variant)+dir+3)%3];const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}});
render();
apiCall('/api/a3/status');
setInterval(()=>{if(!state.pending)apiCall('/api/a3/status')},10000);
</script></body></html>
